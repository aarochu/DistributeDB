name: Process failure trials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Run 100 seeded process kill and restart trials
        run: bash scripts/run_failure_trials.sh
