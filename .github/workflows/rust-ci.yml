name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: Test
        run: cargo test --offline --all-targets
