name: Documentation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Required documents and whitespace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required documents
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            README.md \
            docs/SOW.md \
            docs/Technical-Design.md \
            docs/ADR-001-Language-and-Filesystem.md \
            docs/Development-Setup.md; do
            test -s "$file"
          done

      - name: Check whitespace in tracked changes
        shell: bash
        run: |
          set -euo pipefail
          root_commit="$(git rev-list --max-parents=0 HEAD)"
          git diff --check "$root_commit" HEAD
