[package]
name = "distributedb"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
default-run = "distributedb"
description = "DistributeDB: a single-primary key-value database under development"
license = "MIT"

# The current implementation uses the Rust standard library only.
[dependencies]

[lib]
name = "distributedb"
path = "src/lib.rs"

[[bin]]
name = "distributedb"
path = "src/main.rs"
